<svg xmlns="http://www.w3.org/2000/svg" width="800" height="880" viewBox="0 0 800 880" role="img" aria-labelledby="title desc">
  <title id="title">Speaker v2 claim-aware shadow pipeline</title>
  <desc id="desc">An utterance audio file is passed through a scope gate, parallel evidence adapters, a claim policy router, hypothesis checks, certification, and auditable artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#70838a"/>
    </marker>
    <marker id="arrowRust" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a54d3d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#173642" flood-opacity="0.13"/>
    </filter>
    <style>
      /* Droid Sans Fallback contains the CJK glyphs used by the brief.  Put it
         first so standalone SVG/PNG renderers do not substitute tofu glyphs. */
      .label { font-family: 'Droid Sans Fallback','DejaVu Sans',sans-serif; fill:#173642; font-size:14px; }
      .small { font-family: 'Droid Sans Fallback','DejaVu Sans',sans-serif; fill:#4b5d67; font-size:12px; }
      .tiny { font-family: 'Droid Sans Fallback','DejaVu Sans',sans-serif; fill:#4b5d67; font-size:10px; }
      .bold { font-weight:700; }
      .line { stroke:#70838a; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .dashed { stroke:#b47b38; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
      .reject { stroke:#a54d3d; stroke-width:2; stroke-dasharray:5 5; fill:none; marker-end:url(#arrowRust); }
      .box { stroke-width:2; rx:15; filter:url(#shadow); }
    </style>
  </defs>

  <rect width="800" height="880" fill="#fbfbfb"/>

  <!-- Input and scope -->
  <rect class="box" x="260" y="16" width="280" height="52" fill="#e5f0f3" stroke="#315d6b"/>
  <text class="label bold" x="400" y="37" text-anchor="middle">UTTERANCE-LEVEL SAMPLE</text>
  <text class="small" x="400" y="54" text-anchor="middle">sample.audio.path = complete utterance</text>
  <path class="line" d="M400 68 L400 88"/>

  <rect class="box" x="225" y="88" width="350" height="52" fill="#eef3f4" stroke="#6a858e"/>
  <text class="label bold" x="400" y="110" text-anchor="middle">SCOPE + LINEAGE GATE</text>
  <text class="small" x="400" y="127" text-anchor="middle">[0, duration] | audio hash | dependency groups</text>

  <!-- Explicit inference boundary -->
  <rect x="603" y="14" width="180" height="126" rx="13" fill="#fff4f1" stroke="#a54d3d" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="label bold" x="693" y="36" text-anchor="middle" fill="#a54d3d">INFERENCE BOUNDARY</text>
  <text class="tiny" x="616" y="57">Rejected by adapter / resolver:</text>
  <text class="tiny" x="616" y="74">native metadata | gold ID</text>
  <text class="tiny" x="616" y="90">reference transcript /</text>
  <text class="tiny" x="616" y="104">adjacent audio</text>
  <text class="tiny" x="616" y="124" fill="#a54d3d">post-inference score_native only</text>
  <path class="reject" d="M575 114 C590 114,590 78,603 78"/>

  <!-- Evidence lanes -->
  <rect x="22" y="164" width="756" height="176" rx="18" fill="#ffffff" stroke="#cad0d3" stroke-width="2"/>
  <text class="label bold" x="42" y="188">PARALLEL EVIDENCE ADAPTERS | same sample.audio</text>

  <rect class="box" x="42" y="204" width="165" height="56" fill="#e0eff4" stroke="#4c8396"/>
  <text class="label bold" x="124" y="226" text-anchor="middle">MOSS</text>
  <text class="tiny" x="124" y="244" text-anchor="middle">joint timeline + text | C/M/X</text>
  <rect class="box" x="226" y="204" width="165" height="56" fill="#e0eff4" stroke="#4c8396"/>
  <text class="label bold" x="308" y="226" text-anchor="middle">SORTFORMER</text>
  <text class="tiny" x="308" y="244" text-anchor="middle">timeline | C/M/O/X witness</text>
  <rect class="box" x="410" y="204" width="165" height="56" fill="#e0eff4" stroke="#4c8396"/>
  <text class="label bold" x="492" y="226" text-anchor="middle">PYANNOTE</text>
  <text class="tiny" x="492" y="244" text-anchor="middle">timeline | O primary (shadow)</text>
  <rect class="box" x="594" y="204" width="165" height="56" fill="#fff0d5" stroke="#c98b2d"/>
  <text class="label bold" x="676" y="226" text-anchor="middle">V COVERAGE</text>
  <text class="tiny" x="676" y="244" text-anchor="middle">Brouhaha + FireRed guard</text>

  <rect class="box" x="134" y="274" width="190" height="50" fill="#e7f1e9" stroke="#6a9b7e"/>
  <text class="label bold" x="229" y="294" text-anchor="middle">I IDENTITY</text>
  <text class="tiny" x="229" y="311" text-anchor="middle">ECAPA predicted regions | CAM++ fallback</text>
  <rect class="box" x="338" y="274" width="190" height="50" fill="#f8e7e3" stroke="#c46c5d"/>
  <text class="label bold" x="433" y="294" text-anchor="middle">LEXICAL / AUDIT</text>
  <text class="tiny" x="433" y="311" text-anchor="middle">Whisper optional | never speaker vote</text>

  <path class="line" d="M330 140 L124 204"/>
  <path class="line" d="M365 140 L308 204"/>
  <path class="line" d="M435 140 L492 204"/>
  <path class="line" d="M470 140 L676 204"/>
  <path class="line" d="M390 140 L229 274"/>
  <path class="line" d="M410 140 L433 274"/>

  <!-- Normalize -->
  <path class="line" d="M124 260 L370 366"/>
  <path class="line" d="M308 260 L390 366"/>
  <path class="line" d="M492 260 L410 366"/>
  <path class="line" d="M676 260 L430 366"/>
  <path class="line" d="M229 324 L370 366"/>
  <path class="line" d="M433 324 L430 366"/>
  <rect class="box" x="205" y="366" width="390" height="50" fill="#eef3f4" stroke="#6a858e"/>
  <text class="label bold" x="400" y="387" text-anchor="middle">NORMALIZE + VALIDATE</text>
  <text class="small" x="400" y="404" text-anchor="middle">timebase | anonymous speaker IDs | lineage | contract checks</text>

  <!-- Claim policy router -->
  <path class="line" d="M400 416 L400 438"/>
  <rect class="box" x="158" y="438" width="484" height="63" fill="#eee7f4" stroke="#80619a"/>
  <text class="label bold" x="400" y="462" text-anchor="middle">VERSIONED CLAIM POLICY ROUTER</text>
  <text class="small" x="400" y="481" text-anchor="middle">speaker_v2.claim_policy.20260817.1 | primary / guard / fallback / excluded</text>

  <!-- Four claim cards -->
  <path class="line" d="M205 501 L110 542"/>
  <path class="line" d="M310 501 L285 542"/>
  <path class="line" d="M490 501 L515 542"/>
  <path class="line" d="M595 501 L690 542"/>
  <rect class="box" x="22" y="542" width="176" height="69" fill="#e0eff4" stroke="#4c8396"/>
  <text class="label bold" x="110" y="565" text-anchor="middle">C | COUNT</text>
  <text class="tiny" x="110" y="583" text-anchor="middle">Sortformer primary</text>
  <text class="tiny" x="110" y="598" text-anchor="middle">MOSS fallback</text>
  <rect class="box" x="208" y="542" width="176" height="69" fill="#e0eff4" stroke="#4c8396"/>
  <text class="label bold" x="296" y="565" text-anchor="middle">M | MULTI</text>
  <text class="tiny" x="296" y="583" text-anchor="middle">Sortformer primary</text>
  <text class="tiny" x="296" y="598" text-anchor="middle">MOSS negative guard</text>
  <rect class="box" x="416" y="542" width="176" height="69" fill="#e7f1e9" stroke="#6a9b7e"/>
  <text class="label bold" x="504" y="565" text-anchor="middle">O | OVERLAP</text>
  <text class="tiny" x="504" y="583" text-anchor="middle">pyannote primary</text>
  <text class="tiny" x="504" y="598" text-anchor="middle">Sortformer fallback | MOSS +</text>
  <rect class="box" x="602" y="542" width="176" height="69" fill="#e0eff4" stroke="#4c8396"/>
  <text class="label bold" x="690" y="565" text-anchor="middle">X | CHANGE</text>
  <text class="tiny" x="690" y="583" text-anchor="middle">MOSS primary</text>
  <text class="tiny" x="690" y="598" text-anchor="middle">Sortformer fallback / recall</text>

  <!-- Hypothesis / certification -->
  <path class="line" d="M110 611 L330 655"/>
  <path class="line" d="M296 611 L360 655"/>
  <path class="line" d="M504 611 L440 655"/>
  <path class="line" d="M690 611 L470 655"/>
  <rect class="box" x="176" y="655" width="448" height="57" fill="#eee7f4" stroke="#80619a"/>
  <text class="label bold" x="400" y="678" text-anchor="middle">H1 / H2 / H_other | FROZEN PREDICTION</text>
  <text class="small" x="400" y="697" text-anchor="middle">on conflict: freeze prediction + falsifier + dependency closure</text>
  <path class="line" d="M400 712 L400 736"/>
  <rect class="box" x="174" y="736" width="452" height="52" fill="#f0f4f1" stroke="#5c9375"/>
  <text class="label bold" x="400" y="758" text-anchor="middle">FUSION / CERTIFICATION GATE</text>
  <text class="small" x="400" y="775" text-anchor="middle">event x identity x coverage x calibration x dependency closure</text>

  <!-- Outputs -->
  <path class="line" d="M250 788 L130 814"/>
  <path class="line" d="M400 788 L400 814"/>
  <path class="line" d="M550 788 L670 814"/>
  <rect class="box" x="22" y="814" width="216" height="42" fill="#e1f0e5" stroke="#5c9375"/>
  <text class="label bold" x="130" y="839" text-anchor="middle">CERTIFIED -&gt; bool</text>
  <rect class="box" x="292" y="814" width="216" height="42" fill="#fff0d5" stroke="#c98b2d"/>
  <text class="label bold" x="400" y="839" text-anchor="middle">SUPPORTED -&gt; null</text>
  <rect class="box" x="562" y="814" width="216" height="42" fill="#f8e7e3" stroke="#c46c5d"/>
  <text class="label bold" x="670" y="833" text-anchor="middle">CONFLICT / INSUFFICIENT</text>
  <text class="small bold" x="670" y="850" text-anchor="middle">-&gt; null</text>

  <text class="tiny" x="24" y="875" fill="#4c8396">event timeline</text>
  <text class="tiny" x="180" y="875" fill="#6a9b7e">identity / claim check</text>
  <text class="tiny" x="390" y="875" fill="#c98b2d">coverage guard</text>
  <text class="tiny" x="540" y="875" fill="#c46c5d">lexical / boundary</text>
</svg>
